name: Install the Roc GUI toolchain
description: Install Blueprint, Zig and the Roc nightly this run resolved once.
inputs:
  nightly-tag:
    description: The roc-lang/nightlies tag the run's first job resolved
    required: true
runs:
  using: composite
  steps:
    - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@6c3305f0beb11c44b4db13e9a5d96e196f1cb9d7
    - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
      with:
        version: 0.16.0
        use-cache: false
    - uses: roc-lang/setup-roc@30af91a173612e462a5df47f3b697c53c211f48c
      with:
        version: nightly-new-compiler
        download-method: asset-api
        nightly-tag: ${{ inputs.nightly-tag }}
    - name: Keep downloaded compiler outside release source
      shell: bash
      run: python3 scripts/toolchain.py --relocate-for-ci
    - name: Report the compiler
      shell: bash
      run: roc version
