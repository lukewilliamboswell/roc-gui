name: Install the Roc GUI toolchain
description: Install Zig and the Roc nightly this run resolved once.
inputs:
  nightly-tag:
    description: The roc-lang/nightlies tag the run's first job resolved
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-blueprint
    - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
      with:
        version: 0.16.0
        use-cache: false
    - uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
      with:
        version: nightly-new-compiler
        nightly-tag: ${{ inputs.nightly-tag }}
    - name: Keep downloaded compiler outside release source
      shell: bash
      run: python3 scripts/toolchain.py --relocate-for-ci
    - name: Reject compiler pins and report the compiler
      shell: bash
      run: python3 scripts/toolchain.py --check --roc-bin roc
