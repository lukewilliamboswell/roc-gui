name: Install the Roc nightly
description: Install the nightly this run resolved once, outside the checkout, and report it.
inputs:
  nightly-tag:
    description: The roc-lang/nightlies tag the run's first job resolved
    required: true
runs:
  using: composite
  steps:
    - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
      with:
        version: nightly-new-compiler
        nightly-tag: ${{ inputs.nightly-tag }}
    - name: Keep downloaded compiler outside release source
      shell: bash
      run: python3 scripts/toolchain.py --relocate-for-ci
    - name: Report the compiler
      shell: bash
      run: roc version
