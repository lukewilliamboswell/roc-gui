name: Install the Roc nightly
description: Realise the run's exact Roc nightly through Blueprint's verified download cache.
inputs:
  nightly-tag:
    description: The roc-lang/nightlies tag the run's first job resolved
    required: true
runs:
  using: composite
  steps:
    - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@f2c40def4ca269e4a29b4096edc86f600251aa5d
      with:
        cache: 'true'
        cache-workload: roc-${{ inputs.nightly-tag }}
    - name: Realise the compiler through Blueprint
      shell: bash
      env:
        NIGHTLY_TAG: ${{ inputs.nightly-tag }}
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/toolchain.py --install-for-ci "$NIGHTLY_TAG"
