name: Install Blueprint 0.7.0
description: Install the exact upstream binary and verify its published checksum without Nix.
runs:
  using: composite
  steps:
    - name: Download and verify Blueprint
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        case "$RUNNER_OS" in
          Linux) asset=blueprint-x86_64-linux ;;
          macOS) asset=blueprint-aarch64-darwin ;;
          Windows) asset=blueprint-x86_64-windows.exe ;;
          *) echo "unsupported Blueprint runner" >&2; exit 1 ;;
        esac
        directory="$RUNNER_TEMP/blueprint-0.7.0"
        mkdir -p "$directory"
        gh release download 0.7.0 --clobber --repo lukewilliamboswell/roc-blueprint --pattern "$asset" --pattern blueprint.sha256 --dir "$directory"
        python3 - "$directory" "$asset" <<'PY'
        import hashlib, pathlib, sys
        root, asset = pathlib.Path(sys.argv[1]), sys.argv[2]
        entries = [line.split() for line in (root / 'blueprint.sha256').read_text().splitlines()]
        expected = [digest for digest, name in entries if name == asset]
        actual = hashlib.sha256((root / asset).read_bytes()).hexdigest()
        if expected != [actual]:
            raise SystemExit('Blueprint release checksum mismatch')
        PY
        if [ "$RUNNER_OS" = Windows ]; then
          mv "$directory/$asset" "$directory/blueprint.exe"
        else
          mv "$directory/$asset" "$directory/blueprint"
          chmod +x "$directory/blueprint"
        fi
        echo "$directory" >> "$GITHUB_PATH"
