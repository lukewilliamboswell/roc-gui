name: Prepare native test target
description: Install target dependencies and admit the tested production host
runs:
  using: composite
  steps:
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev
    - name: Install the Windows GNU host target
      if: runner.os == 'Windows'
      shell: bash
      run: |
        rustup toolchain install 1.95.0 --profile minimal
        rustup target add --toolchain 1.95.0 x86_64-pc-windows-gnullvm
    - name: Admit released host or test changed host
      shell: bash
      run: |
        status=0
        python3 scripts/install_released_host.py || status=$?
        case "$status" in
          0) echo "Released host matches the committed host inputs; Cargo build skipped." ;;
          3) python3 scripts/run_cargo.py test --locked --package roc-gui-host ;;
          *) exit "$status" ;;
        esac
