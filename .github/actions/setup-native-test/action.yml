name: Prepare native test target
description: Install target dependencies and admit this run's sealed native host
inputs:
  target:
    description: The host target produced by this run's host workflow
    required: true
runs:
  using: composite
  steps:
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libfreetype6-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: ci-host-${{ inputs.target }}
        path: ${{ runner.temp }}/ci-host
    # Admission verifies the committed source fingerprint and every staged
    # byte, and never builds: a job exercises exactly the sealed host.
    - name: Admit the sealed host
      shell: bash
      run: python3 scripts/ci_host.py admit "$RUNNER_TEMP/ci-host"
