name: Native host

# Produces one target's native host once per run. Every job that exercises the
# host admits this sealed output (`scripts/ci_host.py admit`); none builds it.
# A host whose sources and linker inputs match an earlier run's is restored
# from that run's cache instead of rebuilt. `host-candidate.yml` composes the
# release archive from a fresh build, as a separate call so specifications
# never wait on notice composition.
on:
  workflow_call:
    inputs:
      nightly-tag:
        description: The Roc nightly the calling run resolved
        type: string
        required: true
      os:
        type: string
        required: true
      target:
        type: string
        required: true
      release:
        description: Build fresh, with evidence, even when a cached host matches
        type: boolean
        default: false
    outputs:
      mode:
        description: cached, built, or development
        value: ${{ jobs.build.outputs.mode }}

permissions:
  contents: read

jobs:
  build:
    name: Build and test host (${{ inputs.target }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          nightly-tag: ${{ inputs.nightly-tag }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/roc-gui/link-inputs
          key: link-inputs-${{ runner.os }}-${{ hashFiles('link-inputs.lock.json') }}
          restore-keys: link-inputs-${{ runner.os }}-
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype6-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Install the Windows GNU host target
        if: runner.os == 'Windows'
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 x86_64-pc-windows-gnullvm
      - id: fingerprint
        name: Fingerprint the host sources
        run: echo "value=$(python3 scripts/ci_host.py fingerprint)" >> "$GITHUB_OUTPUT"
      - id: cache
        if: ${{ !inputs.release }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/ci-host
          key: ci-host-v1-${{ inputs.target }}-${{ steps.fingerprint.outputs.value }}-${{ hashFiles('link-inputs.lock.json') }}
      - id: decide
        name: Decide how this checkout's host is produced
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" = true ]; then mode=cached; else mode=$(python3 scripts/ci_host.py decide); fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Host mode: $mode"
      - name: Test the host
        if: steps.decide.outputs.mode != 'cached'
        run: python3 scripts/run_cargo.py test --locked --package roc-gui-host
      - name: Build the host with the release producer
        if: steps.decide.outputs.mode == 'built'
        run: |
          python3 scripts/prepare_host_build.py --evidence "$RUNNER_TEMP/host-evidence/cargo-evidence" --output "$RUNNER_TEMP/host-evidence/host-output"
          python3 scripts/ci_host.py stage-built --host-output "$RUNNER_TEMP/host-evidence/host-output"
      - name: Build the host against development linker inputs
        if: steps.decide.outputs.mode == 'development'
        run: python3 build.py
      - name: Seal the staged host
        if: steps.decide.outputs.mode != 'cached'
        run: python3 scripts/ci_host.py seal --mode "${{ steps.decide.outputs.mode }}" --output "$RUNNER_TEMP/ci-host"
      - name: Cache the sealed host for runs with the same inputs
        if: steps.decide.outputs.mode != 'cached' && !inputs.release
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/ci-host
          key: ci-host-v1-${{ inputs.target }}-${{ steps.fingerprint.outputs.value }}-${{ hashFiles('link-inputs.lock.json') }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-host-${{ inputs.target }}
          path: ${{ runner.temp }}/ci-host
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.decide.outputs.mode == 'built'
        with:
          name: ci-host-evidence-${{ inputs.target }}
          path: ${{ runner.temp }}/host-evidence
          if-no-files-found: error
          retention-days: 7
