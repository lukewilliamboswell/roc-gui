name: macOS interface dependency releases

on:
  pull_request:
    paths:
      - dependencies/macos-interfaces/interfaces.json
      - dependencies/macos-interfaces/PROVENANCE.md
      - scripts/build_macos_interfaces.py
      - scripts/build_macos_stubs.py
      - scripts/audit_macos_archive.py
      - scripts/test_macos_archive_audit.py
      - scripts/test_macos_interfaces.py
      - scripts/dependency_archive.py
      - scripts/dependency_artifacts.py
      - scripts/release_dependencies.py
      - .github/workflows/macos-interface-dependencies.yml
  workflow_dispatch:
    inputs:
      release_tag:
        description: New macOS interface release tag (deps-macos-interfaces-<version>)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: macos-interface-dependencies-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Generate and validate project-authored interfaces
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Check generation, evidence, archive, and admission contracts
        run: python3 -m unittest scripts/test_dependency_artifacts.py scripts/test_macos_archive_audit.py scripts/test_macos_interfaces.py
      - name: Generate the independent release candidate twice
        run: |
          python3 scripts/build_macos_interfaces.py --output "$RUNNER_TEMP/dependencies"
          python3 scripts/build_macos_interfaces.py --output "$RUNNER_TEMP/rebuild"
          cmp "$RUNNER_TEMP/dependencies/macos-interfaces-macos-sysroot.tar" "$RUNNER_TEMP/rebuild/macos-interfaces-macos-sysroot.tar"
      - name: Build the selected host and generate validation interfaces
        run: |
          ./build.py
          rm -rf platform/targets/macos-sysroot
          python3 scripts/build_macos_stubs.py --archives platform/targets/arm64mac --output platform/targets/macos-sysroot
      - name: Inventory the selected host without consulting system interfaces
        run: |
          rustup component add llvm-tools-preview
          python3 scripts/audit_macos_archive.py platform/targets/arm64mac/libhost.a --output "$RUNNER_TEMP/host-imports.json"
      - name: Final-link and run every maintained semantic specification
        run: python3 scripts/run_specs.py --skip-host-build --jobs 1
      - name: Exercise a real GPUI window
        run: |
          roc build --no-cache --target=arm64mac --opt=dev --output="$RUNNER_TEMP/counter" examples/counter/main.roc
          python3 scripts/run_gpui_smoke.py "$RUNNER_TEMP/counter"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-interfaces-macos-sysroot
          path: ${{ runner.temp }}/dependencies/*.tar
          retention-days: 30

  publish:
    name: Attest tested macOS interfaces
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'lukewilliamboswell/roc-gui'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: macos-interfaces-*
          merge-multiple: true
          path: ${{ runner.temp }}/dependencies
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ runner.temp }}/dependencies/*.tar
      - name: Publish exact tested bytes through a verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/release_dependencies.py --directory "$RUNNER_TEMP/dependencies" --tag "$RELEASE_TAG" --kind macos-interfaces
