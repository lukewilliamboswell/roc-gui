name: Release

# A maintainer dispatches a release from the default branch with its version.
# A pull request that touches what a release is made of runs the same build and
# tests as a dry run, for the newest notes under docs/releases/, and publishes
# nothing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a v prefix, such as 0.1.0 or 0.1.0-rc1
        type: string
        required: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - docs/releases/**
      - link-inputs.lock.json
      - scripts/release_suite.roc
      - scripts/suite_archive.py
      - scripts/archived_semantic.py
      - sbom/**
      - Blueprint.roc
      - Blueprint.lock
      - scripts/bundle_platform.py
      - scripts/release.roc
      - scripts/sbom_composition.roc
      - scripts/native_inventory.py
      - scripts/merge_sbom_evidence.roc
      - .github/actions/sbom-release/**
      - scripts/release_notes.roc
      - scripts/src/Notes.roc

permissions: {}

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Resolve the nightly and the version once, and refuse a release that is not
  # ready: off the default branch, already tagged, or without notes.
  validate:
    name: Validate the release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      nightly-tag: ${{ steps.nightly.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@f2c40def4ca269e4a29b4096edc86f600251aa5d
      - id: version
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.version }}
          REF: ${{ github.ref }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: blueprint run release-version

  check:
    name: Roc pins, scripts and applications
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-roc
        with:
          nightly-tag: ${{ needs.validate.outputs.nightly-tag }}
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@f2c40def4ca269e4a29b4096edc86f600251aa5d
        with:
          cache: 'true'
          cache-workload: check
      - run: blueprint run check

  # Each target's host is built fresh on its own system from the release
  # commit, then composed with its notices and source companion.
  host:
    name: Host
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x64glibc }
          - { os: macos-15, target: arm64mac }
          - { os: windows-2025, target: x64mingw }
    uses: ./.github/workflows/host.yml
    with:
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
      release: true
      nightly-tag: ${{ needs.validate.outputs.nightly-tag }}

  candidate:
    name: Host candidate
    needs: [validate, host]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x64glibc }
          - { os: macos-15, target: arm64mac }
          - { os: windows-2025, target: x64mingw }
    uses: ./.github/workflows/host-candidate.yml
    with:
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
      nightly-tag: ${{ needs.validate.outputs.nightly-tag }}

  # Bundle once from those hosts and the locked linker inputs, and build
  # everything else a release holds from that bundle.
  build:
    name: Build the release
    needs: [validate, check, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      assets: ${{ steps.sbom.outputs.assets }}
      subjects: ${{ steps.sbom.outputs.subjects }}
      producing-attempt: ${{ github.run_attempt }}
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-roc
        with:
          nightly-tag: ${{ needs.validate.outputs.nightly-tag }}
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@f2c40def4ca269e4a29b4096edc86f600251aa5d
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: gui-host-*
          merge-multiple: true
          path: ${{ runner.temp }}/hosts
      - uses: ./.github/actions/setup-native-test
        with:
          target: x64glibc
      - id: release
        name: Assemble the release through Roc tasks
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/headless_wayland.py -- blueprint run release-build -- "$RELEASE_VERSION" dist "$RUNNER_TEMP/hosts" .release-out/cache
      - id: sbom
        uses: ./.github/actions/sbom-release
        with:
          version: ${{ needs.validate.outputs.version }}
          bundle: ${{ steps.release.outputs.bundle }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-candidate
          path: |
            ${{ steps.sbom.outputs.assets }}
            dist/sbom-evidence.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-notes
          path: .release-out/cache/release-notes.md
          if-no-files-found: error
          retention-days: 30

  test:
    name: Test the exact bundle (${{ matrix.target }})
    needs: [validate, host, build]
    runs-on: ${{ matrix.os }}
    # Every example and benchmark is built from the bundle and every one of
    # their specifications runs. The Windows runner is the slowest by a wide
    # margin, so this budget follows it rather than the Linux job.
    timeout-minutes: 180
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x64glibc
          - os: macos-15
            target: arm64mac
          - os: windows-2025
            target: x64mingw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-roc
        with:
          nightly-tag: ${{ needs.validate.outputs.nightly-tag }}
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@f2c40def4ca269e4a29b4096edc86f600251aa5d
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-candidate
          path: dist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lukewilliamboswell/roc-automation
          ref: f2c40def4ca269e4a29b4096edc86f600251aa5d
          path: .roc-automation
          persist-credentials: false
      - name: Verify transferred final artifact SBOM bindings
        env:
          INPUT_SUBJECTS: ${{ needs.build.outputs.subjects }}
          INPUT_ASSETS: ${{ needs.build.outputs.assets }}
          INPUT_PRODUCING_ATTEMPT: ${{ needs.build.outputs.producing-attempt }}
          INPUT_VERSION: ${{ needs.validate.outputs.version }}
        run: python3 .roc-automation/actions/sbom-sidecars/verify_transferred.py
      - name: Install native runtime prerequisites
        run: python3 scripts/nightly_prerequisites.py
      - name: Test the immutable published suite against the exact candidate bundle
        env:
          RP_OUTPUT: dist
          RP_DIRECTORY: ${{ runner.temp }}/archive-test
          RP_REPOSITORY: lukewilliamboswell/roc-gui
        run: blueprint run test-archive
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: archive-evidence-${{ matrix.target }}
          path: ${{ runner.temp }}/archive-test
          if-no-files-found: ignore
          retention-days: 14

  # Publication executes only pinned shared controller code on inert files.
  # It never checks out or runs the candidate product sources.
  publish:
    name: Publish the tested release
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, build, test]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-candidate
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-notes
          path: notes
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lukewilliamboswell/roc-automation
          ref: f2c40def4ca269e4a29b4096edc86f600251aa5d
          path: .roc-automation
          persist-credentials: false
      - name: Verify transferred final artifact SBOM bindings
        env:
          INPUT_SUBJECTS: ${{ needs.build.outputs.subjects }}
          INPUT_ASSETS: ${{ needs.build.outputs.assets }}
          INPUT_PRODUCING_ATTEMPT: ${{ needs.build.outputs.producing-attempt }}
          INPUT_VERSION: ${{ needs.validate.outputs.version }}
        run: python3 .roc-automation/actions/sbom-sidecars/verify_transferred.py
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ needs.build.outputs.assets }}
      - uses: lukewilliamboswell/roc-automation/actions/publish-release@f2c40def4ca269e4a29b4096edc86f600251aa5d
        with:
          version: ${{ needs.validate.outputs.version }}
          prerelease: ${{ needs.validate.outputs.prerelease }}
          notes-file: notes/release-notes.md
          assets: ${{ needs.build.outputs.assets }}
