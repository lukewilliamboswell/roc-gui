name: Release

# A maintainer dispatches a release from the default branch with its version.
# A pull request that touches what a release is made of runs the same build and
# tests as a dry run, for the newest notes under docs/releases/, and publishes
# nothing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a v prefix, such as 0.1.0 or 0.1.0-rc1
        type: string
        required: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - docs/releases/**
      - link-inputs.lock.json
      - scripts/bundle_examples.py
      - scripts/bundle_platform.py
      - scripts/check_platform_bundle.py
      - scripts/release_notes.roc
      - scripts/src/Notes.roc

permissions: {}

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Resolve the nightly and the version once, and refuse a release that is not
  # ready: off the default branch, already tagged, or without notes.
  validate:
    name: Validate the release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      nightly-tag: ${{ steps.nightly.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"
      - id: version
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.version }}
          REF: ${{ github.ref }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            version="$REQUESTED"
            test "$REF" = "$DEFAULT_REF" || { echo "::error::release from $DEFAULT_REF only"; exit 1; }
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$version" >/dev/null 2>&1; then
              echo "::error::tag $version already exists"; exit 1
            fi
          else
            version=$(ls docs/releases/*.adoc | sed 's|docs/releases/||; s|\.adoc$||' | sort -V | tail -n 1)
          fi
          echo "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$' \
            || { echo "::error::version must be SemVer without a v prefix: $version"; exit 1; }
          test -f "docs/releases/$version.adoc" || { echo "::error::write docs/releases/$version.adoc first"; exit 1; }
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  check:
    name: Roc pins, scripts and applications
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-roc
        with:
          nightly-tag: ${{ needs.validate.outputs.nightly-tag }}
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7aff4132691ad4fc348abe9df146a57512b49bd6
        with:
          cache: 'true'
          cache-workload: check
      - run: blueprint run check

  # Each target's host is built fresh on its own system from the release
  # commit, then composed with its notices and source companion.
  host:
    name: Host
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x64glibc }
          - { os: macos-15, target: arm64mac }
          - { os: windows-2025, target: x64mingw }
    uses: ./.github/workflows/host.yml
    with:
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
      release: true
      nightly-tag: ${{ needs.validate.outputs.nightly-tag }}

  candidate:
    name: Host candidate
    needs: [validate, host]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x64glibc }
          - { os: macos-15, target: arm64mac }
          - { os: windows-2025, target: x64mingw }
    uses: ./.github/workflows/host-candidate.yml
    with:
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
      nightly-tag: ${{ needs.validate.outputs.nightly-tag }}

  # Bundle once from those hosts and the locked linker inputs, and build
  # everything else a release holds from that bundle.
  build:
    name: Build the release
    needs: [validate, check, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-roc
        with:
          nightly-tag: ${{ needs.validate.outputs.nightly-tag }}
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7aff4132691ad4fc348abe9df146a57512b49bd6
      - name: Verify the locked linker inputs' attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_release_attestations.py link-inputs.lock.json --cache "$RUNNER_TEMP/cache"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: gui-host-*
          merge-multiple: true
          path: ${{ runner.temp }}/hosts
      - name: Bundle the tested hosts and locked linker inputs once
        run: python3 scripts/bundle_platform.py --link-inputs link-inputs.lock.json --hosts "$RUNNER_TEMP/hosts" --output "$RUNNER_TEMP/release" --cache "$RUNNER_TEMP/cache"
      - name: Archive the examples against the release's bundle URL
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: >-
          python3 scripts/bundle_examples.py --output "$RUNNER_TEMP/release"
          --version "$RELEASE_VERSION"
          --manifest "$RUNNER_TEMP/release/release-manifest.json"
      - name: Build the manual that documents these bytes
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python3 scripts/build_docs.py --pdf --docs-version "$RELEASE_VERSION"
          cp .docs-out/roc-gui.pdf "$RUNNER_TEMP/release/roc-gui-$RELEASE_VERSION.pdf"
          (cd .docs-out/site && zip -qr "$RUNNER_TEMP/release/roc-gui-docs-$RELEASE_VERSION.zip" .)
      - name: Render the release notes with the bundle's URL and the compilers
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          bundle=$(jq -r .bundle.name "$RUNNER_TEMP/release/release-manifest.json")
          blueprint run release-notes -- "$RELEASE_VERSION" "$bundle" "$RUNNER_TEMP/release-notes.md"
          mkdir "$RUNNER_TEMP/notes" && mv "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/notes/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes/release-notes.md
          if-no-files-found: error
          retention-days: 30

  test:
    name: Test the exact bundle (${{ matrix.target }})
    needs: [validate, host, build]
    runs-on: ${{ matrix.os }}
    # Every example and benchmark is built from the bundle and every one of
    # their specifications runs. The Windows runner is the slowest by a wide
    # margin, so this budget follows it rather than the Linux job.
    timeout-minutes: 180
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x64glibc
          - os: macos-15
            target: arm64mac
          - os: windows-2025
            target: x64mingw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-roc
        with:
          nightly-tag: ${{ needs.validate.outputs.nightly-tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release
      # The applications' fixtures are recorded by this run's own host for the
      # target, the bytes the bundle carries, admitted rather than rebuilt.
      - uses: ./.github/actions/setup-native-test
        with:
          target: ${{ matrix.target }}
      # Observatory's fixture records real-window sessions, so Linux presents
      # them through a private headless compositor, as CI does.
      - name: Serve and test the exact content-addressed bundle
        run: |
          if [ "$RUNNER_OS" = Linux ]; then present=(python3 scripts/headless_wayland.py --); else present=(); fi
          "${present[@]}" python3 scripts/check_platform_bundle.py --directory "$RUNNER_TEMP/release"

  # The only job that can write. It checks out nothing and runs no repository
  # code: it attests the tested files and hands them to publish-release.
  publish:
    name: Publish the tested release
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, test]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-candidate
          path: candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-notes
          path: notes
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            candidate/*.tar.zst
            candidate/*.tar
            candidate/*.tar.gz
            candidate/*.pdf
            candidate/*.zip
            candidate/release-manifest.json
      - uses: lukewilliamboswell/roc-automation/actions/publish-release@7aff4132691ad4fc348abe9df146a57512b49bd6
        with:
          version: ${{ needs.validate.outputs.version }}
          prerelease: ${{ needs.validate.outputs.prerelease }}
          notes-file: notes/release-notes.md
          assets: |
            candidate/*.tar.zst
            candidate/*.tar
            candidate/*.tar.gz
            candidate/*.pdf
            candidate/*.zip
            candidate/release-manifest.json
