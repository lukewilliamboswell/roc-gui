name: GUI host release candidate

# Builds, tests and composes every target's host for the trusted publisher.
# `publish-gui-hosts.yml` dispatches this on a pull request's exact head and
# releases these bytes unchanged; nothing here can publish.
on:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Build and attest bytes for the trusted publisher
        type: boolean
        default: false
        required: true
      expected_sha:
        description: Exact branch commit requested by the trusted publisher
        type: string
        required: false

permissions: {}

concurrency:
  group: gui-hosts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The latest nightly is resolved once, here; every job installs that one.
  resolve:
    name: Resolve the latest Roc nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      nightly-tag: ${{ steps.nightly.outputs.tag }}
    steps:
      - id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"

  build:
    name: Build and exercise ${{ matrix.target }}
    needs: resolve
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x64glibc
          - os: macos-15
            target: arm64mac
          - os: windows-2025
            target: x64mingw
    uses: ./.github/workflows/host.yml
    with:
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
      release: true
      nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}

  candidate:
    name: Compose ${{ matrix.target }}
    needs: [resolve, build]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x64glibc
          - os: macos-15
            target: arm64mac
          - os: windows-2025
            target: x64mingw
    uses: ./.github/workflows/host-candidate.yml
    with:
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
      nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}

  compose:
    name: Compose the releasable set
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Admit the publisher's exact requested commit
        if: inputs.release_candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test -n "$EXPECTED_SHA" && test "$EXPECTED_SHA" = "$GITHUB_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: gui-host-*
          merge-multiple: true
          path: ${{ runner.temp }}/candidates
      - name: Admit every tested host and write the release manifest
        run: python3 scripts/release_host_artifacts.py --candidates "$RUNNER_TEMP/candidates" --output "$RUNNER_TEMP/release"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        if: inputs.release_candidate
        with:
          subject-path: ${{ runner.temp }}/release/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gui-host-release
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 30
