name: GUI host link inputs

on:
  # Pull requests exercise the same producer through CI's host workflow; this
  # workflow only publishes, and its publish job is the attested signer.
  workflow_dispatch:
    inputs:
      release_tag:
        description: New host release tag (deps-gui-host-<version>)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: gui-hosts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and exercise ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x64glibc
          - os: macos-15
            target: arm64mac
          - os: windows-2025
            target: x64mingw
    uses: ./.github/workflows/host.yml
    with:
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
      release: true

  # The published archives are the candidates composed from the sealed hosts;
  # CI's native specifications exercise the same producer on every change.
  publish:
    name: Attest and publish tested hosts
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'lukewilliamboswell/roc-gui'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: gui-host-*
          merge-multiple: true
          path: ${{ runner.temp }}/host
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ runner.temp }}/host/*.tar
      - name: Publish from a verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/release_host_artifacts.py --directory "$RUNNER_TEMP/host" --tag "$RELEASE_TAG" --target x64glibc --target arm64mac --target x64mingw
