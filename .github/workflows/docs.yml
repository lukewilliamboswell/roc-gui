name: docs
on:
  push:
    branches: [main]
    paths: ["docs/**", "scripts/build_docs.py", ".github/docs.Dockerfile", ".github/mermaid-puppeteer.json", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "scripts/build_docs.py", ".github/docs.Dockerfile", ".github/mermaid-puppeteer.json", ".github/workflows/docs.yml"]
  workflow_dispatch:
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and check HTML and PDF documentation
        run: python3 scripts/build_docs.py --pdf
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: .docs-out/site }
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
