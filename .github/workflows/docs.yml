name: docs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gallery:
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Install the Windows GNU host target
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 x86_64-pc-windows-gnullvm
      - name: Install the gallery encoder
        run: python3 -m pip install Pillow==12.3.0
      - name: Check gallery sources and encoder
        run: |
          python3 scripts/build_example_gallery.py --check
          python3 -m unittest scripts/test_build_example_gallery.py
      - name: Record production example windows
        run: python3 scripts/run_specs.py "examples/*/specs/gallery.scm" --only window --window-retries=1 --output="$RUNNER_TEMP/gallery-captures"
      - name: Build thumbnail GIFs
        run: python3 scripts/build_example_gallery.py --captures="$RUNNER_TEMP/gallery-captures" --output="$RUNNER_TEMP/gallery"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: example-gallery
          path: ${{ runner.temp }}/gallery/*.gif
          retention-days: 30
  build:
    needs: gallery
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The generated API reference comes from the platform's own pinned
      # compiler, so the manual documents the signatures it ships with.
      - uses: ./.github/actions/setup-roc
      # This site tracks the branch, not a release, and says so on its title
      # page rather than claiming the last published version.
      - name: Build and check HTML and PDF documentation
        run: python3 scripts/build_docs.py --pdf --docs-version main
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: example-gallery
          path: .docs-out/site/gallery
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: .docs-out/site }
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
