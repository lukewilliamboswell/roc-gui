name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    name: Native suite (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x64glibc
          - os: macos-15
            target: arm64mac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Repository policy and artifact tests
        run: |
          python3 scripts/check_no_tracked_machine_code.py --all-tracked
          python3 -m unittest \
            scripts/test_no_tracked_machine_code.py \
            scripts/test_dependency_artifacts.py \
            scripts/test_host_release_policy.py \
            scripts/test_macos_interfaces.py
      - name: Admit released host or test changed host
        run: |
          status=0
          python3 scripts/install_released_host.py || status=$?
          case "$status" in
            0) echo "Released host matches the committed host inputs; Cargo build skipped." ;;
            3) python3 scripts/run_cargo.py test --locked --workspace ;;
            *) exit "$status" ;;
          esac
      - name: Full application specification suite
        id: specs
        continue-on-error: true
        run: python3 scripts/run_specs.py --jobs 2
      - name: Diagnose macOS audio specification crash
        if: runner.os == 'macOS' && steps.specs.outcome == 'failure'
        run: |
          roc build --no-cache --target=arm64mac --opt=dev --output="$RUNNER_TEMP/music-player" examples/music-player/main.roc
          lldb --batch -o run -o "thread backtrace all" -- \
            "$RUNNER_TEMP/music-player" \
            --host-run-spec examples/music-player/specs/decode-error.scm \
            --host-stats-output="$RUNNER_TEMP/music-player.rgstats" \
            --host-cap-dir examples/music-player/fixture \
            --host-cap-audio-null
          roc build --no-cache --specialize=no --target=arm64mac --opt=dev \
            --output="$RUNNER_TEMP/music-player-boxy" examples/music-player/main.roc
          "$RUNNER_TEMP/music-player-boxy" \
            --host-run-spec examples/music-player/specs/decode-error.scm \
            --host-stats-output="$RUNNER_TEMP/music-player-boxy.rgstats" \
            --host-cap-dir examples/music-player/fixture \
            --host-cap-audio-null
      - name: Require application specification success
        if: steps.specs.outcome == 'failure'
        run: exit 1
      - name: Real GPUI window smoke
        if: runner.os == 'macOS'
        shell: bash
        run: |
          roc build --no-cache --target=arm64mac --opt=dev --output="$RUNNER_TEMP/counter" examples/counter/main.roc
          python3 scripts/run_gpui_smoke.py "$RUNNER_TEMP/counter"
