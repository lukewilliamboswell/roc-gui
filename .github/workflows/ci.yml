name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The latest nightly is resolved once, here; every job installs that one, so
  # one run never tests two compilers.
  resolve:
    name: Resolve the latest Roc nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      nightly-tag: ${{ steps.nightly.outputs.tag }}
    steps:
      - id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"

  check:
    name: Roc pins, scripts and applications
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-roc
        with:
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@8837e0fc99418b3fcbb04b25a0d789293858f15b
        with:
          cache: 'true'
          cache-workload: check
          sha256-x86_64-linux: 027b2c4d48084d7f6a49b60a378b14dc19920de78c245db3ddffb1db034c74e0
          sha256-aarch64-linux: f328879d0121f97bce52456dacd9a52a3f50f8dde68056797bb0163d02180a43
          sha256-aarch64-darwin: a8dc735d1f022ba80eb835b31888149cd7ac9ec4c9e8d085ba94bfcb5d128857
      - run: blueprint run compiler-version
      - run: blueprint run check

  # The host compiles against committed bindings. They must be the ones the
  # resolved nightly generates from its own glue specification.
  bindings:
    name: Host bindings match the nightly
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-roc
        with:
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@8837e0fc99418b3fcbb04b25a0d789293858f15b
        with:
          sha256-x86_64-linux: 027b2c4d48084d7f6a49b60a378b14dc19920de78c245db3ddffb1db034c74e0
          sha256-aarch64-linux: f328879d0121f97bce52456dacd9a52a3f50f8dde68056797bb0163d02180a43
          sha256-aarch64-darwin: a8dc735d1f022ba80eb835b31888149cd7ac9ec4c9e8d085ba94bfcb5d128857
      - name: Download the nightly's source and verify its published digest
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ needs.resolve.outputs.nightly-tag }}
        run: |
          asset="roc_nightly-source-${NIGHTLY_TAG#nightly-}.tar.gz"
          gh release download "$NIGHTLY_TAG" -R roc-lang/nightlies -p "$asset" -D "$RUNNER_TEMP"
          digest=$(gh release view "$NIGHTLY_TAG" -R roc-lang/nightlies --json assets --jq ".assets[] | select(.name == \"$asset\") | .digest")
          echo "${digest#sha256:}  $RUNNER_TEMP/$asset" | sha256sum -c -
          mkdir "$RUNNER_TEMP/roc-source"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/roc-source" --strip-components=1
      - run: blueprint run regenerate-glue -- "$RUNNER_TEMP/roc-source"
      - name: Require the committed bindings
        run: git diff --exit-code -- crates/host/src

  blueprint:
    name: Blueprint build and application semantics
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-roc
        with:
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@8837e0fc99418b3fcbb04b25a0d789293858f15b
        with:
          install-nix: 'true'
          cache: 'true'
          cache-workload: dev
          sha256-x86_64-linux: 027b2c4d48084d7f6a49b60a378b14dc19920de78c245db3ddffb1db034c74e0
          sha256-aarch64-linux: f328879d0121f97bce52456dacd9a52a3f50f8dde68056797bb0163d02180a43
          sha256-aarch64-darwin: a8dc735d1f022ba80eb835b31888149cd7ac9ec4c9e8d085ba94bfcb5d128857
      - name: Install native Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype6 libxkbcommon0 libxkbcommon-x11-0 libasound2t64 fontconfig sway grim libvulkan1 mesa-vulkan-drivers
      # The macOS environment must evaluate; nothing is built for it here.
      - name: Evaluate the aarch64-darwin environment
        run: |
          blueprint gen
          nix eval --raw "path:$PWD/.blueprint#devShells.aarch64-darwin.default.drvPath" >/dev/null
      - run: blueprint run lint
      - run: blueprint run build
      - run: python3 scripts/headless_wayland.py -- blueprint run test -- --only semantic --jobs 2 --timeout 300

  # Each target's host is produced once; its tests wait only for that host.
  host-x64glibc:
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/host.yml
    with: { os: ubuntu-24.04, target: x64glibc, nightly-tag: "${{ needs.resolve.outputs.nightly-tag }}" }
  host-arm64mac:
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/host.yml
    with: { os: macos-15, target: arm64mac, nightly-tag: "${{ needs.resolve.outputs.nightly-tag }}" }
  host-x64mingw:
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/host.yml
    with: { os: windows-2025, target: x64mingw, nightly-tag: "${{ needs.resolve.outputs.nightly-tag }}" }

  # When the host was built rather than restored, the archive a release would
  # publish is composed from that same sealed build; nothing else waits on it.
  candidate-x64glibc:
    needs: [resolve, host-x64glibc]
    if: needs.host-x64glibc.outputs.mode == 'built'
    permissions:
      contents: read
    uses: ./.github/workflows/host-candidate.yml
    with: { os: ubuntu-24.04, target: x64glibc, nightly-tag: "${{ needs.resolve.outputs.nightly-tag }}" }
  candidate-arm64mac:
    needs: [resolve, host-arm64mac]
    if: needs.host-arm64mac.outputs.mode == 'built'
    permissions:
      contents: read
    uses: ./.github/workflows/host-candidate.yml
    with: { os: macos-15, target: arm64mac, nightly-tag: "${{ needs.resolve.outputs.nightly-tag }}" }
  candidate-x64mingw:
    needs: [resolve, host-x64mingw]
    if: needs.host-x64mingw.outputs.mode == 'built'
    permissions:
      contents: read
    uses: ./.github/workflows/host-candidate.yml
    with: { os: windows-2025, target: x64mingw, nightly-tag: "${{ needs.resolve.outputs.nightly-tag }}" }

  policy:
    name: Repository policy
    needs: [resolve, host-x64glibc]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}
      - uses: ./.github/actions/setup-native-test
        with:
          target: x64glibc
      - name: Release and artifact policy tests
        run: |
          python3 -m unittest \
            scripts/test_ci_host.py \
            scripts/test_compiler_environment.py \
            scripts/test_alsa_dependencies.py \
            scripts/test_link_input_artifacts.py \
            scripts/test_dependency_artifacts.py \
            scripts/test_prepare_windows_gnu.py \
            scripts/test_host_release_policy.py \
            scripts/test_cargo_build_evidence.py \
            scripts/test_git_cargo_sources.py \
            scripts/test_macos_interfaces.py \
            scripts/test_gpui_smoke.py \
            scripts/test_window_routing.py

  native-x64glibc:
    needs: [resolve, host-x64glibc]
    permissions:
      contents: read
    uses: ./.github/workflows/native.yml
    with: { os: ubuntu-24.04, target: x64glibc, spec_jobs: 2, nightly-tag: "${{ needs.resolve.outputs.nightly-tag }}" }
  native-arm64mac:
    needs: [resolve, host-arm64mac]
    permissions:
      contents: read
    uses: ./.github/workflows/native.yml
    with: { os: macos-15, target: arm64mac, smoke_executable: counter, window: true, missing_shots: --allow-missing-shots, nightly-tag: "${{ needs.resolve.outputs.nightly-tag }}" }
  native-x64mingw:
    needs: [resolve, host-x64mingw]
    permissions:
      contents: read
    uses: ./.github/workflows/native.yml
    with: { os: windows-2025, target: x64mingw, smoke_executable: counter.exe, window: true, gallery: true, nightly-tag: "${{ needs.resolve.outputs.nightly-tag }}" }

  docs:
    name: Documentation
    needs: [resolve, native-x64mingw]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # The generated API reference comes from the nightly this run resolved,
      # so the manual documents the signatures that compiler sees.
      - uses: ./.github/actions/setup-roc
        with:
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}
      # This site tracks the branch, not a release, and says so on its title
      # page rather than claiming the last published version.
      - name: Build and check HTML and PDF documentation
        run: python3 scripts/build_docs.py --pdf --docs-version main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: example-gallery
          path: .docs-out/site/gallery
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: .docs-out/site }

  deploy-docs:
    name: Deploy documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The one required status check. Host candidates run only when a host
  # changed, so a skipped job passes; a failed or cancelled one does not.
  ci:
    name: CI
    if: always()
    needs:
      - check
      - bindings
      - blueprint
      - candidate-x64glibc
      - candidate-arm64mac
      - candidate-x64mingw
      - policy
      - native-x64glibc
      - native-arm64mac
      - native-x64mingw
      - docs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to have passed or been skipped by design
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false
