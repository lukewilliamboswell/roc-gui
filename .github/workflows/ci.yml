name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    name: Repository policy and host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - uses: ./.github/actions/setup-native-test
      - name: Repository policy and artifact tests
        run: |
          python3 scripts/check_no_tracked_machine_code.py --all-tracked
          python3 -m unittest \
            scripts/test_no_tracked_machine_code.py \
            scripts/test_dependency_artifacts.py \
            scripts/test_host_release_policy.py \
            scripts/test_macos_interfaces.py \
            scripts/test_gpui_smoke.py \
            scripts/test_window_routing.py
      - name: Test GPUI dependency patches
        run: |
          python3 scripts/run_cargo.py test --locked --package gpui --lib --no-default-features --features wayland,test-support accessed_entity_scope
          python3 scripts/run_cargo.py test --locked --package gpui --lib --no-default-features --features wayland,test-support dirty_cached_parent

  semantics:
    name: Ordinary semantics (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x64glibc
            spec_jobs: 2
          - os: macos-15
            target: arm64mac
            spec_jobs: 1
          - os: windows-2025
            target: x64mingw
            spec_jobs: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - uses: ./.github/actions/setup-native-test
      - name: Run ordinary application specifications
        run: >-
          python3 scripts/run_specs.py "examples/*/specs/*.scm"
          --exclude "examples/*/specs/*scale*.scm"
          --jobs ${{ matrix.spec_jobs }} --timeout 180 --only semantic
          --output="$RUNNER_TEMP/spec-evidence"
      - name: Upload privacy-safe failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: semantic-failure-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/spec-evidence/**/*.failure.json
            ${{ runner.temp }}/spec-evidence/**/*.failure.rgstats
            ${{ runner.temp }}/spec-evidence/**/*.crash.txt
          if-no-files-found: ignore
          retention-days: 7

  scaling:
    name: Scaling semantics (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x64glibc
          - os: macos-15
            target: arm64mac
          - os: windows-2025
            target: x64mingw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - uses: ./.github/actions/setup-native-test
      - name: Run scaling specifications serially
        run: >-
          python3 scripts/run_specs.py "benchmarks/*/specs/*.scm"
          "examples/*/specs/*scale*.scm"
          --jobs 1 --timeout 300 --only semantic
          --output="$RUNNER_TEMP/spec-evidence"
      - name: Upload privacy-safe failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scaling-failure-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/spec-evidence/**/*.failure.json
            ${{ runner.temp }}/spec-evidence/**/*.failure.rgstats
            ${{ runner.temp }}/spec-evidence/**/*.crash.txt
          if-no-files-found: ignore
          retention-days: 7

  smoke:
    name: Native smoke (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: arm64mac
            executable: counter
          - os: windows-2025
            target: x64mingw
            executable: counter.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - uses: ./.github/actions/setup-native-test
      - name: Build and exercise a real GPUI window
        run: |
          roc build --no-cache --target=${{ matrix.target }} --opt=dev --output="$RUNNER_TEMP/${{ matrix.executable }}" examples/counter/main.roc
          python3 scripts/run_gpui_smoke.py "$RUNNER_TEMP/${{ matrix.executable }}" --failure-record="$RUNNER_TEMP/smoke-evidence/failure.json"
      - name: Upload privacy-safe failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: smoke-failure-${{ matrix.target }}
          path: ${{ runner.temp }}/smoke-evidence/failure.json
          if-no-files-found: ignore
          retention-days: 7

  window:
    name: Window specifications (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: arm64mac
            missing_shots: --allow-missing-shots
          - os: windows-2025
            target: x64mingw
            missing_shots: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - uses: ./.github/actions/setup-native-test
      - name: Run real GPUI window specifications
        run: >-
          python3 scripts/run_specs.py --only window
          --exclude "examples/*/specs/gallery.scm"
          --timeout 180 --output="$RUNNER_TEMP/spec-evidence"
          ${{ matrix.missing_shots }}
      - name: Upload privacy-safe failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: window-failure-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/spec-evidence/**/*.failure.json
            ${{ runner.temp }}/spec-evidence/**/report.json
            ${{ runner.temp }}/spec-evidence/**/*.png
            ${{ runner.temp }}/spec-evidence/**/*.crash.txt
          if-no-files-found: ignore
          retention-days: 7
