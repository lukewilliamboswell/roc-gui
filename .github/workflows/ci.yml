name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  blueprint:
    name: Pinned Nix build and application semantics
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - name: Install native Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype6 libxkbcommon0 libxkbcommon-x11-0 libasound2t64 fontconfig
      - name: Build and test through Blueprint
        run: |
          nix develop github:lukewilliamboswell/roc-blueprint/db71ab518d04dc24c5fa1fe1a2423fffdc87aad5 --command bash -euc '
            blueprint run check
            git diff --exit-code -- Blueprint.lock
            # The macOS shell must evaluate; nothing is built for it here.
            nix eval --raw "path:$PWD/.blueprint#devShells.aarch64-darwin.default.drvPath" >/dev/null
            blueprint run lint
            blueprint run build
            blueprint run test -- --only semantic --jobs 2 --timeout 300
          '

  # Each target's host is produced once; its tests wait only for that host.
  host-x64glibc:
    uses: ./.github/workflows/host.yml
    with: { os: ubuntu-24.04, target: x64glibc }
  host-arm64mac:
    uses: ./.github/workflows/host.yml
    with: { os: macos-15, target: arm64mac }
  host-x64mingw:
    uses: ./.github/workflows/host.yml
    with: { os: windows-2025, target: x64mingw }

  # When the host changed, the release archive is composed from the same
  # sealed build; nothing else waits on it.
  candidate-x64glibc:
    needs: host-x64glibc
    if: needs.host-x64glibc.outputs.mode == 'built'
    uses: ./.github/workflows/host-candidate.yml
    with: { os: ubuntu-24.04, target: x64glibc }
  candidate-arm64mac:
    needs: host-arm64mac
    if: needs.host-arm64mac.outputs.mode == 'built'
    uses: ./.github/workflows/host-candidate.yml
    with: { os: macos-15, target: arm64mac }
  candidate-x64mingw:
    needs: host-x64mingw
    if: needs.host-x64mingw.outputs.mode == 'built'
    uses: ./.github/workflows/host-candidate.yml
    with: { os: windows-2025, target: x64mingw }

  policy:
    name: Repository policy
    needs: host-x64glibc
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - uses: ./.github/actions/setup-native-test
        with:
          target: x64glibc
      - name: Repository policy and artifact tests
        run: |
          python3 scripts/check_no_tracked_machine_code.py --all-tracked
          python3 -m unittest             scripts/test_ci_host.py             scripts/test_compiler_environment.py             scripts/test_alsa_dependencies.py             scripts/test_link_input_artifacts.py             scripts/test_no_tracked_machine_code.py             scripts/test_dependency_artifacts.py             scripts/test_host_release_policy.py             scripts/test_cargo_build_evidence.py             scripts/test_git_cargo_sources.py             scripts/test_macos_interfaces.py             scripts/test_gpui_smoke.py             scripts/test_window_routing.py

  native-x64glibc:
    needs: host-x64glibc
    uses: ./.github/workflows/native.yml
    with: { os: ubuntu-24.04, target: x64glibc, spec_jobs: 2 }
  native-arm64mac:
    needs: host-arm64mac
    uses: ./.github/workflows/native.yml
    with: { os: macos-15, target: arm64mac, smoke_executable: counter, window: true, missing_shots: --allow-missing-shots }
  native-x64mingw:
    needs: host-x64mingw
    uses: ./.github/workflows/native.yml
    with: { os: windows-2025, target: x64mingw, smoke_executable: counter.exe, window: true, gallery: true }

  docs:
    name: Documentation
    needs: native-x64mingw
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # The generated API reference comes from the platform's own pinned
      # compiler, so the manual documents the signatures it ships with.
      - uses: ./.github/actions/setup-roc
      # This site tracks the branch, not a release, and says so on its title
      # page rather than claiming the last published version.
      - name: Build and check HTML and PDF documentation
        run: python3 scripts/build_docs.py --pdf --docs-version main
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: example-gallery
          path: .docs-out/site/gallery
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: .docs-out/site }

  deploy-docs:
    name: Deploy documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
