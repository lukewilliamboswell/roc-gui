name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    name: Native suite (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x64glibc
            spec_jobs: 2
          - os: macos-15
            target: arm64mac
            spec_jobs: 1
          - os: windows-2025
            target: x64mingw
            spec_jobs: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Install the Windows GNU host target
        if: runner.os == 'Windows'
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 x86_64-pc-windows-gnullvm
      - name: Repository policy and artifact tests
        run: |
          python3 scripts/check_no_tracked_machine_code.py --all-tracked
          python3 -m unittest \
            scripts/test_no_tracked_machine_code.py \
            scripts/test_dependency_artifacts.py \
            scripts/test_host_release_policy.py \
            scripts/test_macos_interfaces.py \
            scripts/test_window_routing.py
      - name: Admit released host or test changed host
        run: |
          status=0
          python3 scripts/install_released_host.py || status=$?
          case "$status" in
            0) echo "Released host matches the committed host inputs; Cargo build skipped." ;;
            3) python3 scripts/run_cargo.py test --locked --package roc-gui-host ;;
            *) exit "$status" ;;
          esac
      - name: Test GPUI dependency patches
        if: runner.os == 'Linux'
        run: |
          python3 scripts/run_cargo.py test --locked --package gpui --lib --no-default-features --features wayland,test-support accessed_entity_scope
          python3 scripts/run_cargo.py test --locked --package gpui --lib --no-default-features --features wayland,test-support dirty_cached_parent
      - name: Full application specification suite
        run: python3 scripts/run_specs.py --jobs ${{ matrix.spec_jobs }} --timeout 180 --only semantic
      - name: Real GPUI window smoke
        if: runner.os == 'macOS'
        shell: bash
        run: |
          roc build --no-cache --target=arm64mac --opt=dev --output="$RUNNER_TEMP/counter" examples/counter/main.roc
          python3 scripts/run_gpui_smoke.py "$RUNNER_TEMP/counter"
      - name: Real GPUI window smoke (Windows)
        if: runner.os == 'Windows'
        run: |
          roc build --no-cache --target=x64mingw --opt=dev --output="$RUNNER_TEMP/counter.exe" examples/counter/main.roc
          python3 scripts/run_gpui_smoke.py "$RUNNER_TEMP/counter.exe"
      # Screenshots stay unavailable on macOS: hosted runners do not grant Screen
      # Recording. Every behavioural window assertion still gates. Windows
      # captures through PrintWindow and needs no permission.
      # Windows captures through PrintWindow, so a missing screenshot there is a
      # failure rather than a fact of the runner; only macOS is excused.
      - name: Window specifications
        if: runner.os == 'macOS' || runner.os == 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            python3 scripts/run_specs.py --only window --exclude "examples/*/specs/gallery.scm" --allow-missing-shots
          else
            python3 scripts/run_specs.py --only window --exclude "examples/*/specs/gallery.scm"
          fi
