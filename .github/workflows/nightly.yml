name: Nightly compatibility

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      nightly-tag:
        type: string
        default: ''
      release-tag:
        type: string
        default: ''

permissions: {}

jobs:
  compatibility:
    permissions:
      contents: read
      issues: write
    uses: lukewilliamboswell/roc-automation/.github/workflows/nightly-compatibility.yml@f2c40def4ca269e4a29b4096edc86f600251aa5d
    with:
      nightly-tag: ${{ inputs.nightly-tag || '' }}
      release-tag: ${{ inputs.release-tag || '' }}
      runners: '["ubuntu-24.04", "macos-15", "windows-2025"]'
      setup-command: '["python3", "scripts/nightly_prerequisites.py"]'
      case-timeout-ms: '120000'
