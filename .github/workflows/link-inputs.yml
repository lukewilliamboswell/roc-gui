name: Native linker-input release candidate

on:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Build and attest bytes for the trusted publisher
        type: boolean
        default: false
        required: true
      expected_sha:
        description: Exact branch commit requested by the trusted publisher
        type: string
        required: false

permissions: {}

concurrency:
  group: link-inputs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The latest nightly is resolved once, here; every job installs that one.
  resolve:
    name: Resolve the latest Roc nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      nightly-tag: ${{ steps.nightly.outputs.tag }}
    steps:
      - id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"

  linux:
    name: Build Linux inputs twice
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
        with:
          extra-conf: |
            sandbox = true
      - name: Require sandboxed production
        run: test "$(nix config show sandbox)" = true
      - name: Build every Linux component twice
        run: |
          for script in build_alsa_interface build_freetype build_glibc build_unwind build_xkbcommon; do
            python3 "scripts/$script.py" --output "$RUNNER_TEMP/candidate"
            python3 "scripts/$script.py" --rebuild --output "$RUNNER_TEMP/rebuild"
          done
          for archive in "$RUNNER_TEMP/candidate"/*.tar; do
            cmp "$archive" "$RUNNER_TEMP/rebuild/$(basename "$archive")"
          done
      - name: Reproduce derivations from corresponding sources
        run: python3 scripts/check_linux_reproduction.py "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: link-input-components-linux
          path: ${{ runner.temp }}/candidate/*.tar
          retention-days: 30

  linux-validate:
    name: Final-link exact Linux inputs and run outside Nix
    permissions:
      contents: read
    needs: [resolve, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - uses: ./.github/actions/setup-toolchain
        with:
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: link-input-components-linux
          path: ${{ runner.temp }}/candidate
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@8837e0fc99418b3fcbb04b25a0d789293858f15b
        with:
          sha256-x86_64-linux: 027b2c4d48084d7f6a49b60a378b14dc19920de78c245db3ddffb1db034c74e0
          sha256-aarch64-linux: f328879d0121f97bce52456dacd9a52a3f50f8dde68056797bb0163d02180a43
          sha256-aarch64-darwin: a8dc735d1f022ba80eb835b31888149cd7ac9ec4c9e8d085ba94bfcb5d128857
      - name: Build the production host
        run: blueprint run build -- --skip-inputs
      - name: Install native desktop runtime for portability validation
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype6 libxkbcommon0 libxkbcommon-x11-0 libasound2t64 fontconfig xvfb
      - name: Final-link and exercise the exact candidate outside Nix
        run: xvfb-run -a python3 scripts/test_linux_link_inputs.py "$RUNNER_TEMP/candidate" --output "$RUNNER_TEMP/counter"

  macos:
    name: Build and validate macOS interfaces
    needs: resolve
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Generate the reviewed interfaces twice
        run: |
          python3 scripts/build_macos_interfaces.py --output "$RUNNER_TEMP/candidate"
          python3 scripts/build_macos_interfaces.py --output "$RUNNER_TEMP/rebuild"
          cmp "$RUNNER_TEMP/candidate/macos-interfaces-macos-sysroot.tar" "$RUNNER_TEMP/rebuild/macos-interfaces-macos-sysroot.tar"
      - uses: ./.github/actions/setup-toolchain
        with:
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}
      - name: Final-link and run the production platform
        run: |
          ./build.py --source-inputs
          python3 scripts/run_specs.py --skip-host-build --jobs 1 --timeout 300 --exclude "examples/clipboard-history/specs/window-*.scm" --exclude "examples/system-monitor/specs/window-plot-width.scm"
          roc build --no-cache --target=arm64mac --opt=dev --output="$RUNNER_TEMP/counter" examples/counter/main.roc
          python3 scripts/run_gpui_smoke.py "$RUNNER_TEMP/counter"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: link-input-components-macos
          path: ${{ runner.temp }}/candidate/*.tar
          retention-days: 30

  windows-validate:
    name: Execute exact Windows runtime and import candidates
    permissions:
      contents: read
    needs: windows-build
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Preserve corresponding-source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false
      # The runtime's probe is part of its recipe, so it names its own compiler.
      - id: probe
        shell: bash
        run: echo "tag=$(python -c 'import json; print(json.load(open("dependencies/windows-gnu-runtime.json"))["probe_roc_version"])')" >> "$GITHUB_OUTPUT"
      - uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.probe.outputs.tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: link-input-components-windows
          path: ${{ runner.temp }}/candidate
      - name: Execute the exact runtime
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target x86_64-pc-windows-gnullvm
          python scripts/test_windows_gnu_runtime_artifact.py '${{ runner.temp }}/candidate/windows-gnu-runtime-x64mingw.tar' --require-native --evidence '${{ runner.temp }}/runtime-evidence'

      - name: Build native Windows runtime and resource twice
        shell: bash
        run: |
          for output in native-first native-second; do
            python scripts/build_windows_gnu_runtime.py --output "$RUNNER_TEMP/$output"
            python scripts/build_windows_resource.py --output "$RUNNER_TEMP/resource-$output"
          done
          cmp "$RUNNER_TEMP/native-first/windows-gnu-runtime-x64mingw.tar" "$RUNNER_TEMP/native-second/windows-gnu-runtime-x64mingw.tar"
          cmp "$RUNNER_TEMP/resource-native-first/roc-gui.res" "$RUNNER_TEMP/resource-native-second/roc-gui.res"
          cmp "$RUNNER_TEMP/candidate/roc-gui.res" "$RUNNER_TEMP/resource-native-first/roc-gui.res"
      - name: Execute the native-built runtime
        run: python scripts/test_windows_gnu_runtime_artifact.py '${{ runner.temp }}/native-first/windows-gnu-runtime-x64mingw.tar' --require-native --evidence '${{ runner.temp }}/native-runtime-evidence'

  windows-build:
    name: Build Windows inputs twice
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
        with:
          extra-conf: |
            sandbox = true
      - name: Require sandboxed production
        run: test "$(nix config show sandbox)" = true
      - name: Build the runtime and resource twice
        run: |
          python3 scripts/build_windows_gnu_runtime.py --output "$RUNNER_TEMP/candidate"
          python3 scripts/build_windows_gnu_runtime.py --rebuild --output "$RUNNER_TEMP/rebuild"
          python3 scripts/build_windows_resource.py --output "$RUNNER_TEMP/resource-candidate"
          python3 scripts/build_windows_resource.py --rebuild --output "$RUNNER_TEMP/resource-rebuild"
          python3 scripts/check_linux_reproduction.py "$RUNNER_TEMP/candidate" --target x64mingw
          for archive in "$RUNNER_TEMP/candidate"/*.tar; do
            cmp "$archive" "$RUNNER_TEMP/rebuild/$(basename "$archive")"
          done
          cmp "$RUNNER_TEMP/resource-candidate/roc-gui.res" "$RUNNER_TEMP/resource-rebuild/roc-gui.res"
          mkdir "$RUNNER_TEMP/windows-components"
          cp "$RUNNER_TEMP/candidate"/*.tar "$RUNNER_TEMP/windows-components/"
          cp "$RUNNER_TEMP/resource-candidate/roc-gui.res" "$RUNNER_TEMP/windows-components/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: link-input-components-windows
          path: ${{ runner.temp }}/windows-components/*
          retention-days: 30

  assemble:
    name: Assemble and attest exact target archives
    needs: [linux, linux-validate, macos, windows-build, windows-validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Admit the publisher's exact requested commit
        if: inputs.release_candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test -n "$EXPECTED_SHA" && test "$EXPECTED_SHA" = "$GITHUB_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: link-input-components-*
          merge-multiple: true
          path: ${{ runner.temp }}/components
      - name: Compose the independently releasable set
        run: python3 scripts/prepare_link_input_release.py --components "$RUNNER_TEMP/components" --resource "$RUNNER_TEMP/components/roc-gui.res" --output "$RUNNER_TEMP/release"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        if: inputs.release_candidate
        with:
          subject-path: ${{ runner.temp }}/release/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: link-input-release
          path: ${{ runner.temp }}/release/*
          retention-days: 30
