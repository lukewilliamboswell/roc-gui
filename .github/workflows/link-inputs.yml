name: Native linker-input release candidate

on:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Build and attest bytes for the trusted publisher
        type: boolean
        default: false
        required: true
      expected_sha:
        description: Exact branch commit requested by the trusted publisher
        type: string
        required: false

permissions: {}

concurrency:
  group: link-inputs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The latest nightly is resolved once, here; every job installs that one.
  resolve:
    name: Resolve the latest Roc nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      nightly-tag: ${{ steps.nightly.outputs.tag }}
    steps:
      - id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"

  linux:
    name: Build Linux inputs twice
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
        with:
          extra-conf: |
            sandbox = true
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@6c3305f0beb11c44b4db13e9a5d96e196f1cb9d7
      - name: Produce, compare and admit every Linux component
        run: blueprint run link-inputs -- linux "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/rebuild"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: link-input-components-linux
          path: ${{ runner.temp }}/candidate/*
          retention-days: 30

  linux-validate:
    name: Final-link exact Linux inputs and run outside Nix
    permissions:
      contents: read
    needs: [resolve, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - uses: ./.github/actions/setup-toolchain
        with:
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: link-input-components-linux
          path: ${{ runner.temp }}/candidate
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@6c3305f0beb11c44b4db13e9a5d96e196f1cb9d7
      - name: Build the production host against the candidate ALSA interface
        run: blueprint run build -- --skip-inputs --candidate-inputs "$RUNNER_TEMP/candidate"
      - name: Install native desktop runtime for portability validation
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype6 libxkbcommon0 libxkbcommon-x11-0 libasound2t64 fontconfig sway libvulkan1 mesa-vulkan-drivers
      # Linux windows present through a private headless Wayland compositor.
      - name: Final-link and exercise the exact candidate outside Nix
        run: python3 scripts/headless_wayland.py -- python3 scripts/test_linux_link_inputs.py "$RUNNER_TEMP/candidate" --output "$RUNNER_TEMP/counter"

  macos:
    name: Build and validate macOS interfaces
    needs: resolve
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@6c3305f0beb11c44b4db13e9a5d96e196f1cb9d7
      - name: Generate and compare the reviewed interfaces
        run: blueprint run link-inputs -- macos "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/rebuild"
      - uses: ./.github/actions/setup-toolchain
        with:
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@6c3305f0beb11c44b4db13e9a5d96e196f1cb9d7
        with:
          install-nix: 'true'
      # TODO(release blocker): Observatory's window-timeline.scm fails on the
      # hosted macOS runner's 1024-point-wide screen; see https://github.com/lukewilliamboswell/roc-gui/issues/60.
      - name: Final-link and run the production platform
        run: |
          blueprint run build -- --source-inputs
          python3 scripts/run_specs.py --skip-host-build --jobs 1 --timeout 300 --exclude "examples/clipboard-history/specs/window-*.scm" --exclude "examples/system-monitor/specs/window-plot-width.scm" --exclude "examples/observatory/specs/window-timeline.scm"
          roc build --no-cache --target=arm64mac --opt=dev --output="$RUNNER_TEMP/counter" examples/counter/main.roc
          python3 scripts/run_gpui_smoke.py "$RUNNER_TEMP/counter"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: link-input-components-macos
          path: ${{ runner.temp }}/candidate/*.tar
          retention-days: 30

  windows-validate:
    name: Execute exact Windows runtime and import candidates
    permissions:
      contents: read
    needs: windows-build
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Preserve corresponding-source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@6c3305f0beb11c44b4db13e9a5d96e196f1cb9d7
      # The runtime probe is part of its recipe and has its own compiler.
      - id: probe
        shell: bash
        run: blueprint run link-inputs -- probe-tag
      - uses: roc-lang/setup-roc@30af91a173612e462a5df47f3b697c53c211f48c
        with:
          version: nightly-new-compiler
          download-method: asset-api
          nightly-tag: ${{ steps.probe.outputs.tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: link-input-components-windows
          path: ${{ runner.temp }}/candidate
      - name: Execute the exact runtime
        run: |
          rustup show active-toolchain
          rustup target add x86_64-pc-windows-gnullvm
          python scripts/test_windows_gnu_runtime_artifact.py '${{ runner.temp }}/candidate/windows-gnu-runtime-x64mingw.tar' --require-native --evidence '${{ runner.temp }}/runtime-evidence'

      - name: Produce and compare native Windows inputs
        shell: bash
        run: >-
          blueprint run link-inputs -- windows-native
          "$RUNNER_TEMP/native-first" "$RUNNER_TEMP/native-second"
          "$RUNNER_TEMP/resource-native-first" "$RUNNER_TEMP/resource-native-second"
          "$RUNNER_TEMP/candidate"
      - name: Execute the native-built runtime
        run: python scripts/test_windows_gnu_runtime_artifact.py '${{ runner.temp }}/native-first/windows-gnu-runtime-x64mingw.tar' --require-native --evidence '${{ runner.temp }}/native-runtime-evidence'

  windows-build:
    name: Build Windows inputs twice
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
        with:
          extra-conf: |
            sandbox = true
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@6c3305f0beb11c44b4db13e9a5d96e196f1cb9d7
      - name: Produce and compare Windows cross inputs
        run: >-
          blueprint run link-inputs -- windows-cross
          "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/rebuild"
          "$RUNNER_TEMP/resource-candidate" "$RUNNER_TEMP/resource-rebuild"
          "$RUNNER_TEMP/windows-components"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: link-input-components-windows
          path: ${{ runner.temp }}/windows-components/*
          retention-days: 30

  assemble:
    name: Assemble and attest exact target archives
    needs: [linux, linux-validate, macos, windows-build, windows-validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Admit the publisher's exact requested commit
        if: inputs.release_candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test -n "$EXPECTED_SHA" && test "$EXPECTED_SHA" = "$GITHUB_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: link-input-components-*
          merge-multiple: true
          path: ${{ runner.temp }}/components
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@6c3305f0beb11c44b4db13e9a5d96e196f1cb9d7
      - name: Compose the independently releasable set
        run: python3 scripts/prepare_link_input_release.py --components "$RUNNER_TEMP/components" --resource "$RUNNER_TEMP/components/roc-gui.res" --output "$RUNNER_TEMP/release"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        if: inputs.release_candidate
        with:
          subject-path: ${{ runner.temp }}/release/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: link-input-release
          path: ${{ runner.temp }}/release/*
          retention-days: 30
