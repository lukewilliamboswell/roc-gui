# Roc GUI PDF theme.
#
# Extends the asciidoctor-pdf default theme and changes colour, rules and
# spacing only. No font catalog is declared, so the built-in Noto Serif /
# M+ 1mn families ship with the gem are used and the build needs no font
# files of its own.
extends: default

base:
  font-color: #26231F
  font-size: 10.5
  line-height-length: 16
  line-height: $base-line-height-length / $base-font-size

role:
  line-through:
    text-decoration: line-through
  subtle:
    font-color: #756E64

link:
  font-color: #15505F

page:
  margin: [0.7in, 0.75in, 0.75in, 0.75in]
  background-color: #FFFFFF

heading:
  font-color: #26231F
  font-style: bold
  line-height: 1.2
  margin-top: 14
  margin-bottom: 6
  h1:
    font-size: 26
  h2:
    font-size: 19
  h3:
    font-size: 15
  h4:
    font-size: 12.5
  h5:
    font-size: 11
  h6:
    font-size: 10
    font-color: #756E64

title-page:
  align: left
  logo:
    top: 10%
  title:
    top: 40%
    font-size: 30
    font-color: #26231F
  subtitle:
    font-size: 14
    font-color: #756E64
  authors:
    font-color: #4A453E
    font-size: 11

prose:
  margin-bottom: 10

block:
  margin-bottom: 11

caption:
  font-size: 9.5
  font-color: #4A453E
  font-style: italic
  margin-inside: 3
  margin-outside: 0

code:
  font-color: #26231F
  background-color: #F3F0EA
  border-color: #E2DDD3
  border-width: 0.5
  border-left-width: 2
  border-radius: 2
  padding: [7, 9, 7, 9]
  font-size: 9
  line-height: 1.3

codespan:
  font-color: #15505F

codespan:
  font-color: #4A453E

quote:
  border-color: #CFC8BB
  border-left-width: 2
  padding: [0, 10, 0, 12]
  font-color: #4A453E
  cite:
    font-size: 9
    font-color: #756E64

sidebar:
  background-color: #F3F0EA
  border-color: #E2DDD3
  border-width: 0.5
  border-radius: 2
  padding: [10, 12, 10, 12]
  title:
    font-color: #26231F

example:
  background-color: #FFFFFF
  border-color: #E2DDD3
  border-width: 0.5
  border-radius: 2

admonition:
  column-rule-color: #CFC8BB
  column-rule-width: 2
  padding: [0, 10, 0, 10]
  label:
    font-size: 8.5
    font-style: bold
    text-transform: uppercase
  icon:
    note:
      stroke-color: #3F6B8A
    tip:
      stroke-color: #47714F
    warning:
      stroke-color: #9A6A1C
    important:
      stroke-color: #9C4A33
    caution:
      stroke-color: #7C5090

table:
  border-color: #E2DDD3
  border-width: 0
  grid-color: #E2DDD3
  grid-width: 0.5
  cell-padding: [5, 6, 5, 6]
  head:
    font-style: bold
    background-color: #FFFFFF
    border-bottom-width: 1.25
  body:
    stripe-background-color: #F8F6F2
  foot:
    background-color: #F3F0EA

thematic-break:
  border-color: #E2DDD3
  border-width: 0.5
  margin-top: 10
  margin-bottom: 14

list:
  indent: 16
  marker-font-color: #8A8377

description-list:
  term-font-style: bold
  term-spacing: 3
  description-indent: 16

toc:
  font-color: #26231F
  indent: 16
  line-height: 1.5
  dot-leader:
    font-color: #CFC8BB
    levels: 1 2 3
  title:
    font-size: 19
    font-color: #26231F

running-content:
  start-at: toc

header:
  height: 0.6in
  font-size: 8.5
  font-color: #756E64
  border-color: #E2DDD3
  border-width: 0.25
  recto:
    right:
      content: '{document-title}'
  verso:
    left:
      content: '{document-title}'

footer:
  height: 0.6in
  font-size: 8.5
  font-color: #756E64
  border-color: #E2DDD3
  border-width: 0.25
  recto:
    right:
      content: '{chapter-title} | *{page-number}*'
  verso:
    left:
      content: '*{page-number}* | {chapter-title}'
