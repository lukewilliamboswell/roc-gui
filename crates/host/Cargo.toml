[package]
name = "roc-gui-host"
version = "0.1.0"
edition = "2024"
license = "UPL-1.0"

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["wayland"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
libc = "=0.2.189"
sha2 = "=0.10.9"
async-channel = "=2.5.0"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
unicode-segmentation = "=1.13.3"
reqwest = { package = "zed-reqwest", version = "=0.12.15-zed", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["wayland", "test-support"] }

[lib]
name = "host"
crate-type = ["staticlib"]
