[package]
name = "roc-gui-host"
version = "0.1.0"
edition = "2024"
license = "UPL-1.0"

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["wayland"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "limits", "serialize"] }
libc = "=0.2.189"
sha2 = "=0.10.9"
sysinfo = "=0.31.4"
image = "=0.25.10"
usvg = "=0.45.1"
hidapi = { version = "=2.6.5", default-features = false, features = ["linux-native-basic-udev"] }
async-channel = "=2.5.0"
async-std = "=1.13.2"
ashpd = { version = "=0.12.3", default-features = false, features = ["async-std"] }
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
unicode-segmentation = "=1.13.3"
reqwest = { package = "zed-reqwest", version = "=0.12.15-zed", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "wav"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["wayland", "test-support"] }

[lib]
name = "host"
crate-type = ["staticlib"]
