repos:
  - repo: local
    hooks:
      - id: no-tracked-machine-code
        name: Reject tracked machine code
        entry: python3 scripts/check_no_tracked_machine_code.py
        language: system
        pass_filenames: false
      - id: cargo-fmt
        name: Check Rust formatting
        entry: cargo fmt --all -- --check
        language: system
        files: \.rs$
        pass_filenames: false
      # Clippy runs through run_cargo.py so the host links against its verified
      # build-time inputs, the same way CI builds it. Vendored GPUI retains its
      # upstream lint baseline; its local patches have focused CI regressions.
      - id: cargo-clippy
        name: Lint Rust with Clippy
        entry: python3 scripts/run_cargo.py clippy --locked --package roc-gui-host --all-targets --no-deps -- -D warnings
        language: system
        files: (\.rs|Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|\.cargo/config\.toml|scripts/(run_cargo|prepare_dependencies)\.py)$
        pass_filenames: false
      # Code under #[cfg(target_os = ...)] compiles only for that target, so
      # lint the host for the other operating systems too. Needs zig, and
      # llvm-rc for Windows; a target this machine cannot check prints SKIP.
      - id: cargo-clippy-other-targets
        name: Lint Rust for the other host targets
        entry: python3 scripts/check_host_targets.py
        language: system
        files: (\.rs|Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|\.cargo/config\.toml|scripts/check_host_targets\.py)$
        pass_filenames: false
